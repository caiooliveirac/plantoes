name: Release and Deploy

# Deploy no servidor magalu (PM2, sem containers): valida rápido no runner e
# faz git reset + build no próprio servidor via scripts/deploy-magalu.sh.
# O build roda ANTES do restart — se falhar, a produção antiga segue no ar.

on:
  push:
    branches: [main]
    # Tag deploy/migrate-* = deploy com run_migrations=true. Mesmo racional do
    # saldo-repair-maio (aprovado por Caio em 2026-08-04): a integração dos
    # agentes tem permissão de conteúdo (push), mas não actions:write para o
    # dispatch via API. A tag fica no histórico — cada execução é auditável.
    tags:
      - "deploy/migrate-*"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Rodar db:migrate no deploy (faz backup antes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: plantoes-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Listar os artefatos "tested-tree-*" do CI de PR (job check).
  actions: read

jobs:
  # Merge de PR cuja árvore é idêntica à que passou no CI do PR (typecheck,
  # testes e build — ci-pr.yml, job tested-tree) não revalida: é o mesmo código
  # byte a byte. Push direto na main, tag de migração ou main que andou entre o
  # CI e o merge dão árvore nova, e o validate roda.
  check:
    name: Árvore já testada no PR?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
    steps:
      - uses: actions/checkout@v4

      - name: Procurar a árvore nos artefatos do CI de PR
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tested-tree-${tree}" --jq '[.artifacts[] | select(.expired == false)] | length' || echo 0)"
          if [ "${count}" -gt 0 ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
            echo "Árvore ${tree} já passou no CI do PR: validate pulado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "Árvore ${tree} sem CI de PR: validate roda." >> "$GITHUB_STEP_SUMMARY"
          fi

  validate:
    name: Typecheck e testes
    needs: check
    if: needs.check.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantoes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d plantoes_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2
      AUTH_SECRET: ci-local-auth-secret-not-for-production
      AUTH_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Migrações no banco de CI
        run: npm run db:migrate

      - name: Typecheck (next typegen + tsc)
        run: npm run typecheck

      - name: Testes
        run: npm run test:deploy

  deploy:
    name: Deploy no magalu (git + build no servidor + pm2)
    needs: [check, validate]
    # validate pulado (árvore já testada) conta como aprovado; falho ou cancelado, não.
    if: always() && needs.check.result == 'success' && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REMOTE: ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}
      # Terceiro gatilho de migrations: marcador [run-migrations] na mensagem do
      # commit de push (o proxy git dos agentes aceita push de branch, mas não de
      # tag — 403). O merge commit do PR pode carregar o marcador no título.
      RUN_MIGRATIONS: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_migrations) || startsWith(github.ref, 'refs/tags/deploy/migrate-') || contains(github.event.head_commit.message, '[run-migrations]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy (script do repo, executado no servidor)
        run: |
          set -euo pipefail
          MIGRATION_FLAG=""
          if [[ "${RUN_MIGRATIONS}" == "true" ]]; then
            MIGRATION_FLAG=" --run-migrations"
          fi
          scp -i ~/.ssh/id_ed25519 scripts/deploy-magalu.sh "${REMOTE}:/tmp/deploy-magalu.sh"
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=90 -i ~/.ssh/id_ed25519 \
            "${REMOTE}" "bash /tmp/deploy-magalu.sh ${GITHUB_SHA}${MIGRATION_FLAG} && rm -f /tmp/deploy-magalu.sh"

      - name: Healthcheck público
        run: |
          code="$(curl -sk -o /tmp/health.json -w '%{http_code}' https://plantoes.mnrs.com.br/api/health)"
          cat /tmp/health.json || true
          echo
          echo "HTTP ${code}"
          [ "${code}" = "200" ]

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy plantoes.mnrs.com.br (magalu/PM2)"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Migrações: ${RUN_MIGRATIONS}"
            echo "- Upstream local: http://127.0.0.1:3004/api/health"
            echo "- Público: https://plantoes.mnrs.com.br/api/health"
          } >> "$GITHUB_STEP_SUMMARY"
