name: CI (PR)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Dois jobs em paralelo (typecheck+build num, testes no outro) e, se os dois
# passarem, o registro da árvore testada: o deploy do merge pula a revalidação
# quando a árvore do merge commit é idêntica (release-deploy.yml, job "check").

jobs:
  build:
    name: Typecheck e build
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-local-auth-secret-not-for-production
      AUTH_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (next typegen + tsc, produção e tests)
        run: npm run typecheck

      - name: Build
        # Tipos já checados no passo anterior (next.config.ts).
        env:
          NEXT_SKIP_TYPECHECK: "1"
        run: npm run build

  tests:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantoes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d plantoes_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2
      AUTH_SECRET: ci-local-auth-secret-not-for-production
      AUTH_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations in CI database
        run: npm run db:migrate

      - name: Tests (puros em paralelo, banco em série, meal-breaks)
        run: bash scripts/test-gate.sh --com-meal-breaks

  tested-tree:
    name: Typecheck, tests and build
    needs: [build, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A árvore do checkout (refs/pull/N/merge) é o código exato que passou.
      # Se o merge na main produzir a mesma árvore, o deploy não revalida.
      - name: Hash da árvore testada
        id: tree
        run: |
          echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          git rev-parse 'HEAD^{tree}' > tested-tree.txt

      - name: Registrar árvore testada
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree-${{ steps.tree.outputs.sha }}
          path: tested-tree.txt
          retention-days: 14
