name: CI → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time — cancel in-flight runs on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Deploy gate: fast smoke tests only.
  # Runs on push and PR to keep critical checks quick.
  # ──────────────────────────────────────────────────────────
  test_smoke:
    name: Run deploy smoke tests
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run deploy smoke tests
        run: npm run test:deploy
        env:
          # Tests that need DB use a localhost test database.
          # Create it once with: createdb -U postgres plantoes_test
          DATABASE_URL: ${{ vars.DATABASE_URL_TEST || 'postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2' }}

      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit -p tsconfig.deploy.json

  # ──────────────────────────────────────────────────────────
  # Full regression: runs only on pull requests.
  # Keeps deploy path fast while preserving broad coverage.
  # ──────────────────────────────────────────────────────────
  test_regression:
    name: Run full regression tests (PR)
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run full tests
        run: npm run test:full
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL_TEST || 'postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2' }}

  # ──────────────────────────────────────────────────────────
  # Deploy job: only runs on pushes to main (not PRs).
  # The runner IS the production server — no SSH, no secrets.
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: test_smoke
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — commit must come from a merged PR (substitui branch protection paga)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::workflow_dispatch — pulando guard de PR (acao manual auditavel via Actions log)."
            exit 0
          fi
          PR_COUNT=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${COMMIT_SHA}/pulls" \
            | python3 -c "import sys, json; data = json.load(sys.stdin); print(len([p for p in data if p.get('merged_at') and p.get('base', {}).get('ref') == 'main']))")
          if [[ "${PR_COUNT}" -lt 1 ]]; then
            echo "::error::Commit ${COMMIT_SHA} nao veio de um PR mergeado em main. Push direto bloqueado. Abra um PR."
            exit 1
          fi
          echo "::notice::Commit veio de PR mergeado — OK."

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Deploy (PM2 restart with env reload)
        run: npm run deploy:production
        env:
          # EXPECTED_GIT_COMMIT_SHA faz o deploy script reconciliar
          # /home/ubuntu/plantoes para este commit (fetch + checkout).
          # Falha loud se o tree estiver sujo (ALLOW_DIRTY_TREE=1 para override).
          EXPECTED_GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Validate — local upstream
        run: |
          HEALTH=$(curl -fsS http://127.0.0.1:3004/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('ok') == True, 'health.ok is not true'
          rg = d.get('runtimeGuard')
          assert rg == 'ok', f'runtimeGuard: {rg}'
          print('✓ local health ok')
          "

      - name: Validate — public host
        run: |
          CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://plantoes.mnrs.com.br/api/health)
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || (echo "::error::Public health returned $CODE" && exit 1)

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          HEALTH=$(curl -fsS http://127.0.0.1:3004/api/health 2>/dev/null || echo '{}')
          GUARD=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runtimeGuard','?'))")
          echo "- Runtime guard: \`$GUARD\`" >> $GITHUB_STEP_SUMMARY
