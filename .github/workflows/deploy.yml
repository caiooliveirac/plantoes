name: CI → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one deploy at a time — cancel in-flight runs on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Deploy gate: fast smoke tests only.
  # Runs on push and PR to keep critical checks quick.
  # ──────────────────────────────────────────────────────────
  test_smoke:
    name: Run deploy smoke tests
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run deploy smoke tests
        run: npm run test:deploy
        env:
          # Tests that need DB use a localhost test database.
          # Create it once with: createdb -U postgres plantoes_test
          DATABASE_URL: ${{ vars.DATABASE_URL_TEST || 'postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2' }}

      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit -p tsconfig.deploy.json

  # ──────────────────────────────────────────────────────────
  # Full regression: runs only on pull requests.
  # Keeps deploy path fast while preserving broad coverage.
  # ──────────────────────────────────────────────────────────
  test_regression:
    name: Run full regression tests (PR)
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run full tests
        run: npm run test:full
        env:
          DATABASE_URL: ${{ vars.DATABASE_URL_TEST || 'postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2' }}

  # ──────────────────────────────────────────────────────────
  # Deploy job: only runs on pushes to main (not PRs).
  # The runner IS the production server — no SSH, no secrets.
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: test_smoke
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      - name: Deploy (PM2 restart with env reload)
        run: npm run deploy:production
        env:
          # Expose the commit SHA so ecosystem.config.cjs can forward it
          # to PM2 and health endpoint shows it.
          GIT_COMMIT_SHA: ${{ github.sha }}

      - name: Validate — local upstream
        run: |
          HEALTH=$(curl -fsS http://127.0.0.1:3004/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('ok') == True, 'health.ok is not true'
          rt = d.get('runtime', {})
          assert rt.get('runtimeGuard') == 'ok', f'runtimeGuard: {rt.get(\"runtimeGuard\")}'
          print('✓ local health ok')
          "

      - name: Validate — public host
        run: |
          CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://plantoes.mnrs.com.br/api/health)
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || (echo "::error::Public health returned $CODE" && exit 1)

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          HEALTH=$(curl -fsS http://127.0.0.1:3004/api/health 2>/dev/null || echo '{}')
          GUARD=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runtime',{}).get('runtimeGuard','?'))")
          echo "- Runtime guard: \`$GUARD\`" >> $GITHUB_STEP_SUMMARY
