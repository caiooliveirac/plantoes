name: CI → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time — cancel in-flight runs on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # Build fora da EC2: o runner do GitHub faz typecheck e
  # `next build` e publica o artefato .next. A EC2 de produção
  # (2 vCPU / 8GB, compartilhada com ~30 serviços) NÃO roda mais
  # next build — só recebe o artefato pronto. O output de
  # `next build` é JS puro (independente de arquitetura), então
  # buildar em x64 e rodar em arm64 é seguro; os node_modules
  # nativos continuam sendo instalados no host quando o lockfile
  # muda.
  # ──────────────────────────────────────────────────────────
  build:
    name: Typecheck + build (GitHub runner)
    runs-on: ubuntu-latest
    env:
      # O build não toca banco (páginas críticas são force-dynamic);
      # valores dummy só satisfazem código que lê env em import-time.
      # Nada disso é inlinado no bundle (não há NEXT_PUBLIC_* no app).
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      AUTH_SECRET: ci-dummy-secret
      AUTH_URL: http://127.0.0.1:3004
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit -p tsconfig.deploy.json

      - name: Build
        run: npm run build

      - name: Pack .next artifact
        run: |
          set -euo pipefail
          [[ -f .next/BUILD_ID ]] || { echo "::error::.next/BUILD_ID ausente após o build"; exit 1; }
          tar --exclude='./.next/cache' -czf next-build.tgz ./.next
          ls -lh next-build.tgz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tgz
          retention-days: 3
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────
  # Smoke tests também fora da EC2, com Postgres de serviço
  # bootstrapado do zero pelas migrações do repo.
  # ──────────────────────────────────────────────────────────
  test_smoke:
    name: Smoke tests (GitHub runner)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantoes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Bootstrap test schema
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d plantoes_test \
            -c 'create schema if not exists operations_v2'
          npm run db:migrate

      - name: Run deploy smoke tests
        run: npm run test:deploy

  # ──────────────────────────────────────────────────────────
  # Full regression: runs only on pull requests.
  # Informativo, NÃO-bloqueante (ver histórico: flake de DB no
  # runner antigo). Agora roda em Postgres efêmero no GitHub,
  # o que deve eliminar o flake de isolamento — se estabilizar,
  # dá para remover o continue-on-error.
  # ──────────────────────────────────────────────────────────
  test_regression:
    name: Full regression tests (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantoes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/plantoes_test?options=-csearch_path%3Doperations_v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Bootstrap test schema
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d plantoes_test \
            -c 'create schema if not exists operations_v2'
          npm run db:migrate

      - name: Run full tests
        run: npm run test:full

  # ──────────────────────────────────────────────────────────
  # Deploy job: only runs on pushes to main (not PRs).
  # The runner IS the production server — no SSH, no secrets.
  # O trabalho pesado (typecheck, build, testes) já aconteceu
  # nos runners do GitHub; aqui é só baixar o artefato, trocar
  # o .next atomicamente e recarregar o PM2.
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: [build, test_smoke]
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — commit must come from a merged PR (substitui branch protection paga)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "::notice::workflow_dispatch — pulando guard de PR (acao manual auditavel via Actions log)."
            exit 0
          fi
          PR_COUNT=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${COMMIT_SHA}/pulls" \
            | python3 -c "import sys, json; data = json.load(sys.stdin); print(len([p for p in data if p.get('merged_at') and p.get('base', {}).get('ref') == 'main']))")
          if [[ "${PR_COUNT}" -lt 1 ]]; then
            echo "::error::Commit ${COMMIT_SHA} nao veio de um PR mergeado em main. Push direto bloqueado. Abra um PR."
            exit 1
          fi
          echo "::notice::Commit veio de PR mergeado — OK."

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Deploy (artefato pré-buildado — sem build na EC2)
        run: bash scripts/deploy-production.sh
        env:
          # EXPECTED_GIT_COMMIT_SHA faz o deploy script reconciliar
          # /home/ubuntu/plantoes para este commit (fetch + checkout).
          # Falha loud se o tree estiver sujo (ALLOW_DIRTY_TREE=1 para override).
          EXPECTED_GIT_COMMIT_SHA: ${{ github.sha }}
          # Artefato .next buildado no runner do GitHub; o script troca
          # atomicamente e NÃO roda next build local.
          DEPLOY_NEXT_ARTIFACT: ${{ github.workspace }}/next-build.tgz
          # Sem build local o pico de memória é só extract + pm2 reload.
          DEPLOY_MIN_HEADROOM_MB: "700"

      - name: Validate — local upstream
        run: |
          HEALTH=$(curl -fsS http://127.0.0.1:3004/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('ok') == True, 'health.ok is not true'
          rg = d.get('runtimeGuard')
          assert rg == 'ok', f'runtimeGuard: {rg}'
          print('✓ local health ok')
          "

      - name: Validate — public host
        run: |
          CODE=$(curl -sk -o /dev/null -w "%{http_code}" https://plantoes.mnrs.com.br/api/health)
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || (echo "::error::Public health returned $CODE" && exit 1)

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: artefato pré-buildado no GitHub runner (sem next build na EC2)" >> $GITHUB_STEP_SUMMARY
          HEALTH=$(curl -fsS http://127.0.0.1:3004/api/health 2>/dev/null || echo '{}')
          GUARD=$(echo "$HEALTH" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('runtimeGuard','?'))")
          echo "- Runtime guard: \`$GUARD\`" >> $GITHUB_STEP_SUMMARY
